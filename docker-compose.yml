# ============================================================
# PTDARRAHMAN — Production Docker Compose
# ============================================================
# 3 container + Redis (semua di Docker, bukan local):
#
#   1. frontend (Node/pnpm)     → HANYA menyajikan UI (port 3000/5173/5174)
#   2. api       (Python/FastAPI)→ Bisnis logika + database (port 8080)
#   3. whatsapp  (Node.js/npm)  → bridge whatsapp-web.js (port 3100, internal);
#                                 komunikasi dengan FastAPI via HTTP REST / webhook
#   4. redis                     → cache & queue (internal only)
#
# Setup:
#   1. Pastikan apps/api/.env dan apps/whatsapp/.env sudah diisi.
#   2. docker compose up -d --build
#   3. Scan WA QR dari panel Superadmin (render via QR JS, bukan PNG).
# ============================================================

services:
  # ── Container 1: Frontend (Node/pnpm — only serves UI) ────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        # URL yang di-bake ke bundle client. Sesuaikan dengan publish port service `api`.
        # (Browser user memanggil API dari desktop, jadi pakai alamat host.)
        NEXT_PUBLIC_API_URL: ${FRONTEND_NEXT_PUBLIC_API_URL:-http://localhost:8080}
        VITE_API_URL: ${FRONTEND_VITE_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"   # companyprofile (Next.js)
      - "5173:5173"   # ppdb (Vite)
      - "5174:5174"   # superadmin (Vite)
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const ok=p=>new Promise(r=>{http.get(p,res=>{res.resume();r(res.statusCode===200)}).on('error',()=>r(false))});Promise.all([ok('http://localhost:3000'),ok('http://localhost:5173'),ok('http://localhost:5174')]).then(a=>process.exit(a.every(Boolean)?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Container 2: Backend (Python/FastAPI — business logic + DB) ────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    volumes:
      # Uploads disimpan di named volume, bukan bind ke source tree
      - uploads_data:/app/uploads
    env_file:
      - ./apps/api/.env
    environment:
      # Override untuk Docker internal networking
      WA_SERVICE_URL: http://whatsapp:3100
      # Redis (shared dengan WA service, DB index 0 untuk API)
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      # Query DNS publik dari dalam container langsung via Google/Cloudflare,
      # tidak lewat resolver WSL (10.255.255.254) yang kadang gagal menjawab
      # dari bridge Docker. Service-name Docker (redis/api/whatsapp) tetap
      # tersolve via embedded DNS 127.0.0.11.
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Container 3: WhatsApp Microservice (Node.js/npm — WA bridge only) ──────
  whatsapp:
    build:
      context: ./apps/whatsapp
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      # Persistent WhatsApp session data — WAJIB, scan QR ulang jika dihapus
      - wa_session:/app/wa-session
      - wa_logs:/app/logs
    env_file:
      - ./apps/whatsapp/.env
    environment:
      NODE_ENV: production
      # Override untuk Docker internal networking (Redis DI DALAM docker, bukan local)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "1"
      WEBHOOK_URL: http://api:8000/notifications/webhook/whatsapp
    dns:
      # Sama seperti api: hindari resolver WSL yang flaky dari bridge Docker
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    # Puppeteer membutuhkan lebih banyak shared memory
    shm_size: '256mb'
    healthcheck:
      # node (bukan wget) — wget tidak tersedia di image node:slim
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Redis (dalam Docker, internal only) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    # Port TIDAK di-expose ke host — internal only.
    # Uncomment baris di bawah hanya untuk debugging lokal:
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy noeviction
        --save 60 1
        --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

# ── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  wa_session:
    driver: local
  wa_logs:
    driver: local
  # Upload files disimpan di named volume agar tidak tercampur dengan source code
  uploads_data:
    driver: local
